schema_version: 1

context:
  name: curl-cffi
  version: 0.17.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/curl_cffi-${{ version }}.tar.gz
  sha256: 31ee8500d06d6502ce1ec0b7ded1c5aa8e8f3401bbe37ccd78d6153d859d8f3c
  patches:
    - if: osx
      then:
        - fix-symbol-not-found-on-macos.patch

build:
  number: 0
  skip:
    # XXX: wait for someone to fix it on win
    - win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: osx
      then:
        - pkg-config
  host:
    - python
    - wheel
    - setuptools
    - pip
    - cffi >=2.1.1
  run:
    - python
    - cffi >=2.1.1
    - certifi >=2026.10.19

tests:
  - python:
      imports:
        - curl_cffi
      pip_check: true

about:
  summary: libcurl ffi bindings for Python, with impersonation support.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/lexiforest/curl_cffi

extra:
  recipe-maintainers:
    - jan-janssen
    - holymonson
