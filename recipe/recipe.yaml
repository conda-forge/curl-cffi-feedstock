schema_version: 1

context:
  name: curl-cffi
  version: 0.16.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/curl_cffi-${{ version }}.tar.gz
  sha256: 0662a4fe752d395ab3e2e23fbec68e34e1671884d0dd68dfc9671e150f634a99
  patches:
    - fix-symbol-not-found-on-macos.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - wheel
    - setuptools
    - cffi >=1.12.0
    - pip
  run:
    - python
    - cffi >=2.0.0
    - certifi >=2024.2.2
tests:
  - python:
      imports:
        - curl_cffi
      pip_check: true

about:
  summary: libcurl ffi bindings for Python, with impersonation support.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/lexiforest/curl_cffi

extra:
  recipe-maintainers:
    - jan-janssen
